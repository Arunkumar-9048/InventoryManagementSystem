<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row">

            <div class="col-md-3 col-lg-2 bg-dark text-white vh-100 p-0 position-fixed">
                <div class="p-3 bg-dark">
                    <h4 class="text-white mb-0">
                        Inventory
                    </h4>
                </div>

                <ul class="nav flex-column p-3">
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white bg-primary rounded" href="{% url 'dashboard' %}">
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50" href="{% url 'item' %}">
                            Items
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50" href="{% url 'goodsin' %}">
                            Goods In
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50" href="{% url 'goodsout' %}">
                            Goods Out
                        </a>
                    </li>

                </ul>
            </div>

            <div class="col-md-9 col-lg-10 ms-auto p-4">
                <div class="mb-4">
                    <h1 class="text-dark">Inventory Dashboard</h1>
                </div>

                <div class="row mb-4">

                    <div class="col-xl-3 col-lg-4 col-md-6 mb-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-dark text-white">
                                <i class="bi bi-box-seam me-2"></i> Total Items
                            </div>
                            <div class="card-body">
                                <h2 class="card-title text-dark">{{ total_items }}</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-lg-4 col-md-6 mb-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-primary text-white">
                                <i class="bi bi-arrow-down-circle me-2"></i> Goods In
                            </div>
                            <div class="card-body">
                                <h2 class="card-title text-dark">{{ total_goods_in }}</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-lg-4 col-md-6 mb-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-danger text-white">
                                <i class="bi bi-arrow-up-circle me-2"></i> Goods Out
                            </div>
                            <div class="card-body">
                                <h2 class="card-title text-dark">{{ total_goods_out }}</h2>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
</body>

</html>
