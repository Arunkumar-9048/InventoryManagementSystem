<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container-fluid">
        <div class="row">

            <div class="col-md-3 col-lg-2 bg-dark text-white vh-100 p-0 position-fixed">
                <div class="p-3 bg-dark">
                    <h4 class="text-white mb-0">
                        Inventory
                    </h4>
                </div>

                <ul class="nav flex-column p-3">
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50 " href="{% url 'dashboard' %}">
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white " href="{% url 'item' %}">
                            Items
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50" href="{% url 'goodsin' %}">
                            Goods In
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white bg-primary rounded" href="{% url 'goodsout' %}">
                            Goods Out
                        </a>
                    </li>
                  
                </ul>
            </div>


            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 ms-auto p-4">
                <!-- Page Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="text-dark mb-1">Goods Out</h1>
                    </div>
                </div>

                <!-- Items Table -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white border-0 py-3">
                        <h5 class="mb-0">Removed and Expired items</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Item ID</th>
                                        <th>Item Name</th>
                                        <th>Quantity</th>
                                        <th>date removed</th>
                                        <th class="text-end pe-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for i in out %}
                                    <tr>
                                        <td class="ps-4 fw-bold">{{ i.id }}</td>

                                        <td>
                                            <div class="d-flex align-items-center">
                                                <div>
                                                    <h6 class="mb-0">{{ i.item.item_name }}</h6>
                                                </div>
                                            </div>
                                        </td>

                                        <td>{{ i.quantity }}</td>

                                        <td>{{ i.date_removed }}</td>

                                        <td class="text-end pe-4">
                                            <a href=""
                                                class="btn btn-sm btn-outline-danger">
                                                delete
                                            </a>
                                        </td>
                                    </tr>
                                    {% endfor %}

                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
