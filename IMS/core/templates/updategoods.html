<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Make sidebar full width on small screens */
        @media (max-width: 768px) {
            .sidebar {
                position: relative !important;
                width: 100% !important;
                height: auto !important;
            }

            .main-content {
                margin-left: 0 !important;
            }
        }

        /* Desktop layout preserved */
        @media (min-width: 769px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 250px;
            }

            .main-content {
                margin-left: 250px;
            }
        }
    </style>
</head>

<body class="bg-light">

    <div class="container-fluid p-0">
        <div class="row g-0">

            <!-- Sidebar -->
            <div class="col-12 col-md-3 col-lg-2 bg-dark text-white p-0 sidebar">
                <div class="p-3 bg-dark">
                    <h4 class="text-white mb-0">Inventory</h4>
                </div>

                <ul class="nav flex-column p-3">
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50" href="{% url 'item' %}">Items</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white " href="{% url 'goodsin' %}">Goods In</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50" href="{% url 'goodsout' %}">Goods Out</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50" href="#">Report</a>
                    </li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-12 col-md-9 col-lg-10 p-4 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="text-dark mb-1">Goods Management</h1>
                </div>

                <!-- Update Item Card -->
                <div class="container">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">Update Goods</h4>
                        </div>

                        <div class="card-body">

                            <form action="" method="POST">
                                {% csrf_token %}

                                <div class="row">

                                    <select class="form-control" name="itemName" required>
                                        <option value="">-- Select Item --</option>
                                        {% for itm in items %}
                                        <option value="{{ itm.id }}" {% if goods.itemname.id == itm.id %}selected{% endif%}>
                                            {{ itm.item_name }}
                                        </option>
                                        {% endfor %}
                                    </select>

                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Quantity</label>
                                        <input type="number" class="form-control" id="quantity" name="quantity"
                                            value="{{ goods.quantity }}" required>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Expiry Date</label>
                                        <input type="date" class="form-control" id="expirydate" name="expirydate"
                                            value="{{ goods.expiry_date }}" required>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Entry Number</label>
                                        <input type="text" class="form-control" id="Entry_number" name="Entry_number"
                                            value="{{ goods.entry_number }}" required>
                                    </div>

                                    <div class="modal-footer">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-plus-circle me-2"></i> Update Goods
                                        </button>
                                    </div>

                                </div>

                            </form>

                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
