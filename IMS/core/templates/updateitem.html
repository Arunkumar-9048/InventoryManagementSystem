<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Make sidebar full width on small screens */
        @media (max-width: 768px) {
            .sidebar {
                position: relative !important;
                width: 100% !important;
                height: auto !important;
            }
            .main-content {
                margin-left: 0 !important;
            }
        }

        /* Desktop layout preserved */
        @media (min-width: 769px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 250px;
            }
            .main-content {
                margin-left: 250px;
            }
        }
    </style>
</head>

<body class="bg-light">

    <div class="container-fluid p-0">
        <div class="row g-0">

            <!-- Sidebar -->
            <div class="col-12 col-md-3 col-lg-2 bg-dark text-white p-0 sidebar">
                <div class="p-3 bg-dark">
                    <h4 class="text-white mb-0">Inventory</h4>
                </div>

                <ul class="nav flex-column p-3">
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white bg-primary rounded" href="{% url 'item' %}">Items</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50" href="{% url 'goodsin' %}">Goods In</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50" href="{% url 'goodsout' %}">Goods Out</a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link text-white-50" href="#">Report</a>
                    </li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-12 col-md-9 col-lg-10 p-4 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="text-dark mb-1">Items Management</h1>
                </div>

                <!-- Update Item Card -->
                <div class="container">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">Update Item</h4>
                        </div>

                        <div class="card-body">

                            <form action="" method="POST">
                                {% csrf_token %}

                                <div class="row">

                                    <!-- Item Name -->
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Item Name *</label>
                                        <input type="text" class="form-control" name="itemName"
                                            value="{{ item.item_name }}" required>
                                    </div>

                                    <!-- Description -->
                                    <div class="mb-3">
                                        <label class="form-label">Description</label>
                                        <textarea class="form-control" name="itemDescription" rows="3">{{ item.description }}</textarea>
                                    </div>

                                    <!-- Radio Buttons -->
                                    <div class="mb-3">
                                        <label class="form-label">Item Status</label>

                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="has_entry_number" value="True"
                                                {% if item.has_entry_number %}checked{% endif %}>
                                            <label class="form-check-label">Has Entry Number</label>
                                        </div>

                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="has_expiry" value="True"
                                                {% if item.has_expiry %}checked{% endif %}>
                                            <label class="form-check-label">Has Expiry</label>
                                        </div>
                                    </div>

                                    <div class="text-end">
                                        <button type="submit" class="btn btn-primary">Update Item</button>
                                    </div>

                                </div>

                            </form>

                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
